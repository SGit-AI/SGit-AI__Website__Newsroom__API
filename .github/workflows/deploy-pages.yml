# dev, the default branch, is the release branch (the github-pages environment deploys the default branch only): check -> tag the
# version -> publish api.newsroom.sgit.ai -> ask the live host for every hash of the reader-code release. Every change that lands
# here is a version (tools/version.json: v0.2.1, v0.2.2, ...); the tag job refuses one that is already tagged.
# The site is the releases/ directory (tools/release.py site): one directory per release, never edited after it is
# published, an index and releases.json. Pages for this repository deploys from GitHub Actions (configure-pages enables it).
name: deploy-pages
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax, the manifest, and the build twice
        run: |
          set -euo pipefail
          for f in $(git ls-files '*.js' '*.mjs' | grep -v '^releases/'); do node --check "$f"; done
          python3 tools/release.py check
          python3 tools/release.py cut --out /tmp/rb/a >/dev/null; python3 tools/release.py cut --out /tmp/rb/b >/dev/null; diff -r /tmp/rb/a /tmp/rb/b
          python3 site/build.py --check
          python3 site/check.py
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this version, from tools/version.json (every change that lands here is a new version)
        run: |
          set -euo pipefail
          TAG=$(python3 -c 'import json;print(json.load(open("tools/version.json"))["version"])')
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then echo "$TAG already tagged on this commit"; exit 0; fi
            echo "::error::$TAG is already the tag of $(git rev-parse --short "refs/tags/$TAG^{commit}"); every change that lands on dev bumps tools/version.json (v0.2.1, v0.2.2, ...)"; exit 1
          fi
          LATEST=$(git tag --list 'v*' | sort -V | tail -1 || true)
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$TAG" | sort -V | tail -1)" != "$TAG" ]; then
            echo "::error::$TAG is not above the latest tag $LATEST"; exit 1
          fi
          git config user.name 'GitHub Actions'; git config user.email 'actions@github.com'
          git tag "$TAG" HEAD && git push origin "refs/tags/$TAG" && echo "tagged $TAG"
          # Backfill, best effort: several versions can land in one push (each commit's subject carries its version, "vX.Y.Z: ...").
          # Every such commit in the history that has no tag gets one, so /versions/ links to a tag for each. GITHUB_TOKEN may refuse
          # a tag on a commit whose workflow files differ from this one's; those are reported, not fatal.
          LOG=$(git log --format='%H;%s' HEAD)
          while IFS=';' read -r h s; do
            v=$(printf '%s' "$s" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+(?=:)' -P || true)
            if [ -n "$v" ] && ! git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
              git tag "$v" "$h"
              if git push origin "refs/tags/$v" >/dev/null 2>&1; then echo "backfilled $v -> ${h:0:9}"; else echo "::warning::could not push the backfill tag $v (${h:0:9})"; fi
            fi
          done <<< "$LOG"
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site from releases/
        run: python3 tools/release.py site --out /tmp/site && ls /tmp/site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: The live host serves every file of the current release with the hash in its manifest
        run: python3 tools/live_check.py --wait 480
