# dev, the default branch, is the release branch (the github-pages environment deploys the default branch only): check -> tag -> publish api.newsroom.sgit.ai -> ask the live host for every hash.
# The site is the releases/ directory (tools/release.py site): one directory per release, never edited after it is
# published, an index and releases.json. Pages for this repository deploys from GitHub Actions (configure-pages enables it).
name: deploy-pages
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax, the manifest, and the build twice
        run: |
          set -euo pipefail
          for f in $(git ls-files '*.js' '*.mjs' | grep -v '^releases/'); do node --check "$f"; done
          python3 tools/release.py check
          python3 tools/release.py cut --out /tmp/rb/a >/dev/null; python3 tools/release.py cut --out /tmp/rb/b >/dev/null; diff -r /tmp/rb/a /tmp/rb/b
          python3 site/build.py --check
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this release, from tools/version.json
        run: |
          set -euo pipefail
          TAG=$(python3 -c 'import json;print(json.load(open("tools/version.json"))["release"])')
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if ! git merge-base --is-ancestor "refs/tags/$TAG" HEAD; then echo "::error::$TAG exists on another history"; exit 1; fi
            echo "$TAG already tagged"; exit 0
          fi
          git config user.name 'GitHub Actions'; git config user.email 'actions@github.com'
          git tag "$TAG" HEAD && git push origin "refs/tags/$TAG" && echo "tagged $TAG"
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site from releases/
        run: python3 tools/release.py site --out /tmp/site && ls /tmp/site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: The live host serves every file of the current release with the hash in its manifest
        run: python3 tools/live_check.py --wait 480
